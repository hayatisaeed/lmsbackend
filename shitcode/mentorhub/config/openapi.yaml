openapi: 3.0.3
info:
  title: MentorHub API
  version: 1.0.0
  description: A comprehensive API for educational mentoring platform
  contact:
    name: MentorHub Team
    email: support@mentorhub.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
paths:
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/auth/login/:
    post:
      operationId: users_auth_login_create
      description: Single endpoint for both login and registration - just provide
        phone number
      summary: Unified Login/Registration
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/auth/login/password/:
    post:
      operationId: users_auth_login_password_create
      description: Login with phone and password
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/auth/register/:
    post:
      operationId: users_auth_register_create
      description: Register a new user with phone number (other fields optional)
      summary: User Registration
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/auth/test-info/:
    get:
      operationId: users_auth_test_info_retrieve
      description: Get information about the test phone number for development/testing
        purposes
      summary: Get Test Phone Information
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/auth/verify/otp/:
    post:
      operationId: users_auth_verify_otp_create
      description: Verify OTP code and automatically create/update user, then return
        JWT tokens
      summary: Verify OTP and Login/Register
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/cities/:
    get:
      operationId: users_cities_list
      description: Get cities, optionally filtered by state
      summary: List Cities
      parameters:
      - in: query
        name: state
        schema:
          type: integer
        description: Filter by state ID
      tags:
      - Location
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
          description: ''
  /api/users/educational-levels/:
    get:
      operationId: users_educational_levels_list
      description: Get all available educational levels
      summary: List Educational Levels
      tags:
      - Education
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EducationalLevel'
          description: ''
  /api/users/olympiads/:
    get:
      operationId: users_olympiads_list
      description: Get all published olympiads
      summary: List Olympiads
      tags:
      - Education
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Olympiad'
          description: ''
  /api/users/profile/:
    get:
      operationId: users_profile_retrieve
      description: Get current user profile
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/profile/completion/:
    get:
      operationId: users_profile_completion_retrieve
      description: Check profile completion status
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/profile/education/:
    get:
      operationId: users_profile_education_retrieve
      description: Handle educational profile submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: users_profile_education_create
      description: Handle educational profile submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/profile/identity/:
    get:
      operationId: users_profile_identity_retrieve
      description: Handle identity information submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: users_profile_identity_create
      description: Handle identity information submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/profile/parent/:
    get:
      operationId: users_profile_parent_retrieve
      description: Handle parent contact information submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: users_profile_parent_create
      description: Handle parent contact information submission
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/profile/parent/verify/:
    post:
      operationId: users_profile_parent_verify_create
      description: Verify parent contact with code
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/protected/:
    get:
      operationId: users_protected_retrieve
      description: Example protected resource that requires complete profile
      tags:
      - users
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/users/states/:
    get:
      operationId: users_states_list
      description: Get all available states/provinces
      summary: List States
      tags:
      - Location
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
          description: ''
  /api/users/study-branches/:
    get:
      operationId: users_study_branches_list
      description: Get study branches, optionally filtered by educational level
      summary: List Study Branches
      parameters:
      - in: query
        name: level
        schema:
          type: integer
        description: Filter by educational level ID
      tags:
      - Education
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyBranch'
          description: ''
components:
  schemas:
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        state:
          type: integer
        state_name:
          type: string
          readOnly: true
          description: State name
      required:
      - id
      - name
      - state
      - state_name
    EducationalLevel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        is_high_school:
          type: boolean
      required:
      - id
      - name
    Olympiad:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        published:
          type: boolean
        olympiad_degree:
          type: integer
          maximum: 5
          minimum: 1
          description: Certificate validity ranking (1-5 scale)
      required:
      - id
      - name
      - olympiad_degree
    State:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    StudyBranch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        educational_level:
          type: integer
        level_name:
          type: string
          readOnly: true
          description: Educational level name
        name:
          type: string
          maxLength: 100
      required:
      - educational_level
      - id
      - level_name
      - name
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: User registration and authentication endpoints
- name: Profile
  description: User profile management endpoints
- name: Education
  description: Educational data and profile endpoints
- name: Location
  description: States and cities data endpoints
- name: Parent
  description: Parent contact management endpoints
